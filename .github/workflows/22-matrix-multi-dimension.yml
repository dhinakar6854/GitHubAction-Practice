name: 22 - Matrix Include / Exclude

on: workflow_dispatch

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

        # Exclude unwanted combinations
        exclude:
          - os: macos-latest
            node: 20
          - os: macos-latest
            node: 22

        # Add labels or new combinations
        include:
          - os: ubuntu-latest
            node: 24
            label: '(primary)'

          - os: ubuntu-latest
            node: 18
            label: '(legacy support)'

    defaults:
      run:
        working-directory: sample-app

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: .

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sample-app/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Display matrix combination
      - name: Report this combination
        run: echo "os=${{ matrix.os }} node=${{ matrix.node }} label=${{ matrix.label }}"

      # Run tests
      - name: Run tests
        run: npm test

        
