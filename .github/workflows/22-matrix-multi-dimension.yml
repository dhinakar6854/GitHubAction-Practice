name: 22 - Matrix Include / Exclude

on: workflow_dispatch

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

        exclude:
          - os: macos-latest
            node: 20
          - os: macos-latest
            node: 22

        include:
          - os: ubuntu-latest
            node: 24
            label: '(primary)'

          - os: ubuntu-latest
            node: 18
            label: '(legacy support)'

    defaults:
      run:
        working-directory: sample-app

    steps:
      - name: Show workspace
        run: |
          echo "Workspace: ${{ github.workspace }}"
          echo "Runner OS: ${{ runner.os }}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify project files
        working-directory: .
        run: |
          echo "Repository checkout completed."
          echo "Inspect the workspace for sample-app."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sample-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report this combination
        run: echo "os=${{ matrix.os }} node=${{ matrix.node }} label=${{ matrix.label }}"

      - name: Run tests
        run: npm test
