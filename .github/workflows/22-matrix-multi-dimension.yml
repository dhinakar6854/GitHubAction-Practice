
name: 22 - Matrix Include / Exclude

on: workflow_dispatch

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

        exclude:
          - os: macos-latest
            node: 20
          - os: macos-latest
            node: 22

        include:
          - os: ubuntu-latest
            node: 24
            label: '(primary)'

          - os: ubuntu-latest
            node: 18
            label: '(legacy support)'

    defaults:
      run:
        working-directory: sample-app

    steps:
      # STEP 1: Diagnose the Windows runner environment
      - name: Inspect runner environment
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Host "GITHUB_WORKFLOW: $env:GITHUB_WORKFLOW"
          Write-Host "Current directory:"
          Get-Location

      # STEP 2: Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # STEP 3: Verify the application directory
      - name: Verify sample-app directory
        shell: bash
        working-directory: .
        run: |
          echo "Repository workspace: $GITHUB_WORKSPACE"
          ls -la
          ls -la sample-app

      # STEP 4: Set up the selected Node.js version
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sample-app/package-lock.json

      # STEP 5: Install dependencies
      - name: Install dependencies
        run: npm ci

      # STEP 6: Report the matrix combination
      - name: Report this combination
        run: echo "os=${{ matrix.os }} node=${{ matrix.node }} label=${{ matrix.label }}"

      # STEP 7: Run application tests
      - name: Run tests
        run: npm test
